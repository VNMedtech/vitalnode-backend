name: Deploy API (Manual)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch/tag/sha)"
        required: false
        default: "main"

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build in CI
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.EC2_PORT || '22' }}" "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Clean disk on EC2 before upload
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.EC2_PORT || '22' }}" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -euo pipefail
          df -h /
          sudo -u vitalnode -H npm cache clean --force || true
          sudo rm -rf /home/vitalnode/.npm/_cacache /tmp/vitalnode-server-release
          if [[ -d /opt/vitalnode/server/node_modules ]]; then
            sudo -u vitalnode -H bash -lc 'cd /opt/vitalnode/server && rm -rf node_modules'
          fi
          sudo apt-get clean || true
          sudo journalctl --vacuum-size=100M || true
          df -h /
          EOF

      - name: Upload release artifacts to EC2
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d)"
          mkdir -p "$STAGE_DIR"

          cp package.json package-lock.json prisma.config.ts "$STAGE_DIR/"
          cp -a dist "$STAGE_DIR/dist"
          cp -a prisma "$STAGE_DIR/prisma"
          mkdir -p "$STAGE_DIR/generated"
          cp -a generated/prisma "$STAGE_DIR/generated/prisma"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.EC2_PORT || '22' }}" \
            "$STAGE_DIR/" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/vitalnode-server-release/"

          rm -rf "$STAGE_DIR"

      - name: Deploy on EC2 (prod install, migrate, restart)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.EC2_PORT || '22' }}" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -euo pipefail

          sudo mkdir -p /opt/vitalnode/server
          sudo rsync -a --delete /tmp/vitalnode-server-release/ /opt/vitalnode/server/
          sudo chown -R vitalnode:vitalnode /opt/vitalnode/server

          # Production deps only — build already done in GitHub Actions.
          sudo -u vitalnode -H bash -lc 'cd /opt/vitalnode/server && npm ci --omit=dev'
          sudo -u vitalnode -H bash -lc 'set -a; source /etc/vitalnode/prod.env; set +a; cd /opt/vitalnode/server && npm run db:migrate:deploy'

          sudo systemctl restart vitalnode-api
          sleep 3
          sudo systemctl is-active --quiet vitalnode-api
          curl -fsS https://api.vitalnode.in/ready
          EOF
